name: Disable shared broadcast

on:
  push:
    branches: [broadcast-canary]
    paths:
      - '.github/workflows/broadcast-canary.yml'
      - 'broadcast_manifest_worker.mjs'
      - 'wrangler.broadcast-canary.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realsignal-broadcast-canary
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Publish the disabled schedule endpoints
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.broadcast-canary.jsonc
