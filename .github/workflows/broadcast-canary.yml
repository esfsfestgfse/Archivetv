name: Refresh broadcast canary

on:
  push:
    branches: [broadcast-canary]
  schedule:
    - cron: '29 * * * *'
    - cron: '49 * * * *'
  workflow_run:
    workflows: [Deepen OK catalogs, Deepen Vimeo catalogs]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: realsignal-broadcast-canary
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECKPOINT: output/broadcast-hosted-state
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name == 'broadcast-canary' && github.sha || 'broadcast-canary' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore the last deployed catalog and rotation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$CHECKPOINT"
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          previous_runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?status=success&per_page=20" --jq '.workflow_runs[].id')
          if [[ -n "$previous_runs" ]]; then
            while read -r previous_run; do
              artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run/artifacts?name=broadcast-checkpoint" --jq '.artifacts[] | select(.name == "broadcast-checkpoint" and .expired == false) | .id')
              if [[ -n "$artifact" ]]; then
                gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name broadcast-checkpoint --dir "$CHECKPOINT"
                break
              fi
            done <<< "$previous_runs"
          else
            gzip -dc scripts/broadcast-canary-seed.json.gz > "$CHECKPOINT/schedule.json"
          fi
          test -s "$CHECKPOINT/schedule.json"
      - name: Check whether the current schedule needs a refresh
        id: coverage
        if: github.event_name == 'schedule' || github.event_name == 'workflow_run'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { stations } = JSON.parse(readFileSync(process.env.CHECKPOINT + '/schedule.json', 'utf8'));
          const now = Date.now();
          const active = stations.filter(station => station.slots.some(slot => slot.startsAt <= now && slot.endsAt > now));
          const latest = Math.max(...active.map(station => station.generatedAt));
          const fresh = latest >= now - 35 * 60_000 &&
            active.every(station => station.slots.at(-1).endsAt >= now + 60 * 60_000);
          appendFileSync(process.env.GITHUB_OUTPUT, 'fresh=' + fresh + '\n');
          console.log(fresh ? 'A recent refresh already covers the next hour.' : 'The broadcast schedule needs a refresh.');
          NODE
      - name: Verify broadcast scheduling and playback
        if: steps.coverage.outputs.fresh != 'true'
        run: node --test scripts/test-broadcast-schedule.mjs scripts/test-broadcast-player.mjs scripts/test-youtube-embed-runtime.js scripts/test-peertube-media.js
      - name: Refresh and validate the broadcast lineup
        if: steps.coverage.outputs.fresh != 'true'
        run: |
          node scripts/build-broadcast-pilot.mjs "$CHECKPOINT" --all --sources
          node scripts/assemble-broadcast-canary.mjs "$CHECKPOINT" output/broadcast-hosted-site
      - name: Save the catalog and rotation checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-checkpoint
          path: output/broadcast-hosted-state/schedule.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Publish the isolated broadcast canary
        if: steps.coverage.outputs.fresh != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.broadcast-canary.jsonc
