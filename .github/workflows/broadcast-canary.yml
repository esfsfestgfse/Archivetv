name: Refresh broadcast canary

on:
  push:
    branches: [broadcast-canary]
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: realsignal-broadcast-canary
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHECKPOINT: output/broadcast-hosted-state
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name == 'broadcast-canary' && github.sha || 'broadcast-canary' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Restore the last deployed catalog and rotation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$CHECKPOINT"
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .workflow_id)
          previous_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name broadcast-checkpoint --dir "$CHECKPOINT"
          else
            gzip -dc scripts/broadcast-canary-seed.json.gz > "$CHECKPOINT/schedule.json"
          fi
          test -s "$CHECKPOINT/schedule.json"
      - name: Verify broadcast scheduling and playback
        run: node --test scripts/test-broadcast-schedule.mjs scripts/test-broadcast-player.mjs scripts/test-youtube-embed-runtime.js scripts/test-peertube-media.js
      - name: Refresh and validate the broadcast lineup
        run: |
          node scripts/build-broadcast-pilot.mjs "$CHECKPOINT" --all --sources
          node scripts/assemble-broadcast-canary.mjs "$CHECKPOINT" output/broadcast-hosted-site
      - name: Save the catalog and rotation checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-checkpoint
          path: output/broadcast-hosted-state/schedule.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Publish the isolated broadcast canary
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.broadcast-canary.jsonc
