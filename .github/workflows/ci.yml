name: Archive TV CI
on:
  push:
    paths:
      - 'the_dial_mobile.html'
      - 'the_dial_desktop.html'
      - 'realsignal_cast_receiver.html'
      - 'afterglow_ais_relay_worker.js'
      - 'realsignal_api_v2_worker.js'
      - 'realsignal_api_rotation.js'
      - 'realsignal_source_catalog.js'
      - 'vimeo_catalog.js'
      - 'assets/vimeo-embed-runtime.js'
      - 'assets/youtube-embed-runtime.js'
      - 'ok_public_embed_catalog.js'
      - 'ok_public_search.js'
      - 'ok_animation_catalog.js'
      - 'ok_curated_tv_catalog.js'
      - 'ok_music_catalog.js'
      - 'ok_animation_verified_seed.js'
      - 'ok_verified_search_seed.js'
      - 'assets/ok-embed-runtime.js'
      - 'ia_canonical_station.mjs'
      - 'ia_file_contract.js'
      - 'ia_durable_state.js'
      - 'assets/ia-playback-shelf.js'
      - 'ia_canonical_pilot_manifest.js'
      - 'source_suite_profile_registry.js'
      - 'wrangler.api.jsonc'
      - 'migrations/**'
      - 'assets/source-catalog-client.js'
      - 'assets/source-program-policy.js'
      - 'assets/guide-contract*.js'
      - 'assets/v6-watching-shell.*'
      - 'assets/v6-guide.*'
      - 'assets/fast-catalog.js'
      - 'assets/weather-networks.*'
      - 'assets/weather-local.*'
      - 'assets/commercial-scheduler.js'
      - 'assets/release2-runtime.js'
      - 'assets/release3-runtime.js'
      - 'sw.js'
      - 'manifest.json'
      - 'android-sender/**'
      - 'wrangler.jsonc'
      - 'ci/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate IA relay Worker contract
        run: node scripts/check-worker-contract.js
      - name: Validate IA collection-depth rails
        run: node scripts/test-ia-collection-depth.js
      - name: Validate exhaustive IA audit coverage
        run: node --test scripts/test-ia-audit-coverage.mjs
      - name: Validate Chromecast sender and receiver contract
        run: node scripts/check-cast-contract.js
      - name: Validate opt-in Roku preview contract
        run: node scripts/check-roku-contract.js
      - name: Test Cast channel changes, guide, and recovery
        run: node scripts/test-cast-runtime.js
      - name: Test IA audit measurements
        run: node scripts/test-ia-soak-measurements.js
      - name: Test IA local fallback recovery
        run: node scripts/test-ia-fallback-refill.js
      - name: Test IA persisted rotation rollover
        run: node scripts/test-ia-rotation.js
      - name: Test IA catalog integrity and played-only reservations
        run: node --test scripts/test-ia-audit-integrity.js
      - name: Test IA selected-file qualification and transport
        run: node --test scripts/test-ia-file-qualification.js
      - name: Test classic and modern game-show eras and depth
        run: node --test scripts/test-ia-gameshow-split.js
      - name: Test broad IA file depth and show identity
        run: node --test scripts/test-ia-broad-station-depth.js
      - name: Test merged IA programming admits both approved member formats
        run: node --test scripts/test-ia-merged-admission.js
      - name: Test resumable IA search and episode discovery
        run: node --test scripts/test-ia-resumable-discovery.js
      - name: Test one IA playback order and post-start recovery
        run: node --test scripts/test-ia-playback-order.js
      - name: Test selected IA file runtime and decoded admission
        run: node --test scripts/test-ia-runtime-admission.js
      - name: Validate IA review regressions and durable catalog ownership
        run: |
          node --test scripts/test-ia-review-regressions.js
          node --test scripts/test-ia-durable-owner.js
          node --test scripts/test-ia-telemetry-correlation.js
          node --test scripts/test-playback-audit-correlation.js
          node --test scripts/test-ia-certification-readiness.js
      - name: Test delayed live-data callbacks across channel changes
        run: node scripts/test-live-data-lifecycle.js
      - name: Test Weather Watch network selection and cleanup
        run: |
          node --test scripts/test-weather-networks.js
          node --test scripts/test-weather-local.js
      - name: Test FAST source selection, real-frame health, and manual Sports ownership
        run: |
          node --test scripts/test-live-tv-recovery.js
          node --test scripts/test-hls-proxy.mjs
          node scripts/test-fast-recovery-contract.js
      - name: Guard guide row stability during background queue warming
        run: node scripts/test-guide-row-stability.js
      - name: Guard single guide renderer ownership and card behavior
        run: node --test scripts/test-guide-renderer-ownership.js
      - name: Validate shared V6 guide snapshots and command routing
        run: node --test scripts/test-guide-contract.js
      - name: Validate guarded V6 watching presentation
        run: node --test scripts/test-v6-watching-shell.js
      - name: Validate guarded V6 guide browsing and focus
        run: node --test scripts/test-v6-guide.js
      - name: Validate inter-program commercial scheduling and recovery
        run: node --test scripts/test-v6-commercials.js
      - name: Validate 2.2 health telemetry runtime
        run: node scripts/test-release2-runtime.js
      - name: Validate V6 prerelease and stale build stamp admission
        run: node --test scripts/test-release-stamps.js
      - name: Validate V3 API contract
        run: node scripts/test-v3-api-contract.js
      - name: Validate YouTube catalog depth and diagnostics
        run: node scripts/test-youtube-catalog-depth.js
      - name: Reject cartoon commentary on discovery, stored rows, and client shelves
        run: |
          node --test scripts/test-cartoon-program-admission.mjs
          node --test scripts/test-suite-editorial-boundaries.mjs
          node --test scripts/test-restoration-program-admission.mjs
      - name: Validate OK title search and playback recovery
        run: node scripts/test-ok-source-recovery.js
      - name: Validate persistent OK discovery and deep episode rotation
        run: node scripts/test-ok-catalog-depth.js
      - name: Validate guarded OK TV decade pilot
        run: node scripts/test-ok-tv-decades.js
      - name: Validate OK TV decade metadata backfill
        run: node scripts/test-ok-tv-decade-backfill.mjs
      - name: Validate separated OK animation families
        run: node scripts/test-ok-animation.js
      - name: Validate persistent OK animation catalogs and freshness
        run: node scripts/test-ok-animation-depth.js
      - name: Validate curated OK television identity and tune races
        run: node scripts/test-ok-curated-tv.js
      - name: Validate OK music identity, era and freshness
        run: node scripts/test-ok-music.js
      - name: Validate separated country music discovery and rotation
        run: node scripts/test-ok-country.js
      - name: Validate MTV-style Video Hits discovery and rotation
        run: node scripts/test-ok-video-hits.js
      - name: Validate shared music EOF recovery
        run: node scripts/test-ok-music-exhaustion.js
      - name: Validate Vimeo public catalog depth and episode rotation
        run: node scripts/test-vimeo-catalog-depth.js
      - name: Validate actual Vimeo playback lifecycle
        run: node scripts/test-vimeo-embed-runtime.js
      - name: Test YouTube player ownership and transient recovery
        run: |
          node scripts/test-youtube-embed-runtime.js
          node --test scripts/test-youtube-direct-handoff.mjs
          node scripts/test-youtube-client-recovery.js
      - name: Validate guarded IA canonical pilot
        run: node scripts/test-ia-canonical-pilot.js
      - name: Validate Version 4 hybrid lineup
        run: node scripts/test-ia-hybrid-lineup.js

  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Validate HTML syntax and build stamps
        run: node scripts/check-html-syntax.js
      - name: Validate IA channel contract
        run: |
          node scripts/audit-ia-channels.js the_dial_mobile.html
          node scripts/check-ia-contract.js the_dial_mobile.html
          node scripts/check-ia-parity.js
          node scripts/check-channel-registry.js
          node scripts/check-source-suite-contract.js
          node scripts/check-cast-contract.js
          node scripts/check-roku-contract.js
          node scripts/test-guide-row-stability.js
          node scripts/test-modern-cartoons-lock.js
          node scripts/test-modern-rerun-lock.js
          node scripts/test-darcys-playground-lock.js
          node scripts/test-source-suite-catalog-retention.js
           node scripts/test-source-suite-language-lock.js
           node scripts/test-animation-lane-locks.js
           node scripts/test-manufacturing-marvels-contract.js
      - name: Serve app
        run: |
          python -m http.server 8799 &
          sleep 2
      - name: Run tune-all (all discovered channels, zero page errors)
        run: python ci/test_tune_all.py http://localhost:8799/the_dial_mobile.html
      - name: Run regression (10-point functional check)
        run: python ci/test_regression.py http://localhost:8799/the_dial_mobile.html
      - name: Validate visible prerelease chip matching
        run: python -m unittest discover -s ci -p test_build_stamp.py
      - name: Validate fixture network isolation
        run: python -m unittest discover -s ci -p test_fixture_network.py
      - name: Test 2.2 telemetry dashboard
        run: python scripts/test-telemetry-dashboard.py http://localhost:8799/the_dial_mobile.html
      - name: Validate V3 API contract
        run: node scripts/test-v3-api-contract.js
      - name: Validate YouTube catalog depth and diagnostics
        run: node scripts/test-youtube-catalog-depth.js
      - name: Validate guarded IA canonical pilot
        run: node scripts/test-ia-canonical-pilot.js
      - name: Validate Version 4 hybrid lineup
        run: node scripts/test-ia-hybrid-lineup.js

  test-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Validate HTML syntax and build stamps
        run: node scripts/check-html-syntax.js
      - name: Validate IA channel contract
        run: |
          node scripts/audit-ia-channels.js the_dial_desktop.html
          node scripts/check-ia-contract.js the_dial_desktop.html
          node scripts/check-ia-parity.js
          node scripts/check-channel-registry.js
          node scripts/check-source-suite-contract.js
          node scripts/check-cast-contract.js
          node scripts/check-roku-contract.js
          node scripts/test-guide-row-stability.js
          node scripts/test-modern-cartoons-lock.js
          node scripts/test-modern-rerun-lock.js
          node scripts/test-darcys-playground-lock.js
          node scripts/test-source-suite-catalog-retention.js
           node scripts/test-source-suite-language-lock.js
           node scripts/test-animation-lane-locks.js
           node scripts/test-manufacturing-marvels-contract.js
      - name: Serve app
        run: |
          python -m http.server 8800 &
          sleep 2
      - name: Run tune-all (all discovered channels, zero page errors)
        run: python ci/test_tune_all.py http://localhost:8800/the_dial_desktop.html
      - name: Run regression (10-point functional check)
        run: python ci/test_regression.py http://localhost:8800/the_dial_desktop.html
      - name: Validate visible prerelease chip matching
        run: python -m unittest discover -s ci -p test_build_stamp.py
      - name: Validate fixture network isolation
        run: python -m unittest discover -s ci -p test_fixture_network.py
      - name: Test 2.2 telemetry dashboard
        run: python scripts/test-telemetry-dashboard.py http://localhost:8800/the_dial_desktop.html
      - name: Validate V3 API contract
        run: node scripts/test-v3-api-contract.js
      - name: Validate YouTube catalog depth and diagnostics
        run: node scripts/test-youtube-catalog-depth.js
      - name: Validate guarded IA canonical pilot
        run: node scripts/test-ia-canonical-pilot.js
      - name: Validate Version 4 hybrid lineup
        run: node scripts/test-ia-hybrid-lineup.js
