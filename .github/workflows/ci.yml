name: Archive TV CI
on:
  push:
    paths:
      - 'the_dial_mobile.html'
      - 'the_dial_desktop.html'
      - 'realsignal_cast_receiver.html'
      - 'afterglow_ais_relay_worker.js'
      - 'wrangler.jsonc'
      - 'ci/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate IA relay Worker contract
        run: node scripts/check-worker-contract.js
      - name: Validate Chromecast sender and receiver contract
        run: node scripts/check-cast-contract.js
      - name: Test Cast channel changes, guide, and recovery
        run: node scripts/test-cast-runtime.js
      - name: Test IA audit measurements
        run: node scripts/test-ia-soak-measurements.js
      - name: Test IA local fallback recovery
        run: node scripts/test-ia-fallback-refill.js
      - name: Test IA persisted rotation rollover
        run: node scripts/test-ia-rotation.js
      - name: Test delayed live-data callbacks across channel changes
        run: node scripts/test-live-data-lifecycle.js
      - name: Guard guide row stability during background queue warming
        run: node scripts/test-guide-row-stability.js

  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Validate HTML syntax and build stamps
        run: node scripts/check-html-syntax.js
      - name: Validate IA channel contract
        run: |
          node scripts/audit-ia-channels.js the_dial_mobile.html
          node scripts/check-ia-contract.js the_dial_mobile.html
          node scripts/check-ia-parity.js
          node scripts/check-channel-registry.js
          node scripts/check-source-suite-contract.js
          node scripts/check-cast-contract.js
          node scripts/test-guide-row-stability.js
          node scripts/test-modern-cartoons-lock.js
          node scripts/test-modern-rerun-lock.js
      - name: Serve app
        run: |
          python -m http.server 8799 &
          sleep 2
      - name: Run tune-all (all discovered channels, zero page errors)
        run: python ci/test_tune_all.py http://localhost:8799/the_dial_mobile.html
      - name: Run regression (10-point functional check)
        run: python ci/test_regression.py http://localhost:8799/the_dial_mobile.html

  test-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium
      - name: Validate HTML syntax and build stamps
        run: node scripts/check-html-syntax.js
      - name: Validate IA channel contract
        run: |
          node scripts/audit-ia-channels.js the_dial_desktop.html
          node scripts/check-ia-contract.js the_dial_desktop.html
          node scripts/check-ia-parity.js
          node scripts/check-channel-registry.js
          node scripts/check-source-suite-contract.js
          node scripts/check-cast-contract.js
          node scripts/test-guide-row-stability.js
          node scripts/test-modern-cartoons-lock.js
          node scripts/test-modern-rerun-lock.js
      - name: Serve app
        run: |
          python -m http.server 8800 &
          sleep 2
      - name: Run tune-all (all discovered channels, zero page errors)
        run: python ci/test_tune_all.py http://localhost:8800/the_dial_desktop.html
      - name: Run regression (10-point functional check)
        run: python ci/test_regression.py http://localhost:8800/the_dial_desktop.html
