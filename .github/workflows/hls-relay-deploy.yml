name: Deploy FAST HLS Relay
on:
  push:
    branches: [main]
    paths:
      - 'hls_proxy_worker.js'
      - 'wrangler.hls-proxy.jsonc'
      - 'scripts/test-hls-proxy.mjs'
      - '.github/workflows/hls-relay-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-hls-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check relative playlists and relay boundary
        run: node --test scripts/test-hls-proxy.mjs
      - name: Deploy existing HLS relay
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.hls-proxy.jsonc
