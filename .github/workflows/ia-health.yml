name: Internet Archive Health

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      # G is retained as a historical diagnostic table. It includes a few
      # archive-only lanes that are intentionally not authoritative for the
      # current PROGRAM/relay catalog, so a zero-result legacy rail must not
      # prevent the real provider and queue checks from running.
      - name: Probe legacy representative genre rails (diagnostic)
        run: node scripts/probe-ia-genres.js --out artifacts/ia-genre-health.json
      - name: Probe PROGRAM provider rails
        run: node scripts/probe-ia-programs.js --strict --out artifacts/ia-program-health.json
      - name: Refresh the shared ready-to-play channel shelf
        id: ia_primary_soak
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: |
          node scripts/export-ia-manifest.js the_dial_desktop.html --out artifacts/ia-queue-manifest.json
          # Probe two fresh rotations per lane each night. The second rotation
          # measures long-tail freshness and repeats; concurrency stays low so
          # the audit does not manufacture timeout/no-signal results.
          DAILY_ROTATION_BASE=$(( $(date +%s) / 86400 % 128 ))
          node scripts/soak-ia-queues.js --manifest artifacts/ia-queue-manifest.json --count 5 --rotations 2 --rotation-base "$DAILY_ROTATION_BASE" --require-ready 1 --concurrency 2 --timeout-ms 22000 --depth-timeout-ms 6000 --poll-ms 1000 --strict --out artifacts/ia-ready-shelf-warm.json
      - name: Retry transient IA failures serially
        if: ${{ !cancelled() }}
        run: |
          DAILY_ROTATION_BASE=$(( $(date +%s) / 86400 % 128 ))
          node scripts/retry-ia-failures.js --manifest artifacts/ia-queue-manifest.json --report artifacts/ia-ready-shelf-warm.json --out artifacts/ia-ready-shelf-retry.json --count 5 --rotation-base "$DAILY_ROTATION_BASE" --timeout-ms 30000 --depth-timeout-ms 8000 --poll-ms 1000 --backoff-ms 2000
      - name: Upload probe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-health-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
