name: Publish RealSignal

on:
  push:
    branches:
      - main
    paths:
      - 'the_dial_desktop.html'
      - 'the_dial_mobile.html'
      - 'realsignal_cast_receiver.html'
      - 'sw.js'
      - 'manifest.json'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      # A fast release gate for first-play availability. The scheduled IA
      # workflow remains the authoritative full-depth/all-channel soak.
      - name: Build release smoke manifest
        run: |
          mkdir -p artifacts
          node scripts/export-ia-manifest.js the_dial_desktop.html --out artifacts/ia-queue-manifest.json

      - name: Smoke representative IA lanes
        run: >-
          node scripts/soak-ia-queues.js
          --manifest artifacts/ia-queue-manifest.json
          --channels 132,150,206,208,210,212,227,239
          --count 3
          --rotations 1
          --require-ready 1
          --concurrency 8
          --timeout-ms 15000
          --depth-timeout-ms 3500
          --poll-ms 500
          --strict
          --out artifacts/ia-release-smoke.json

      - name: Upload IA smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-release-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  deploy:
    needs: validate-ia
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Assemble public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp the_dial_desktop.html _site/index.html
          cp the_dial_desktop.html _site/the_dial_desktop.html
          cp the_dial_mobile.html _site/the_dial_mobile.html
          cp realsignal_cast_receiver.html _site/realsignal_cast_receiver.html
          cp sw.js manifest.json icon-192.png icon-512.png _site/
          cp assets/* _site/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
