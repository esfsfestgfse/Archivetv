name: Deploy RealSignal V2 API

on:
  push:
    branches: [main]
    paths:
      - 'realsignal_api_v2_worker.js'
      - 'realsignal_api_rotation.js'
      - 'realsignal_source_catalog.js'
      - 'source_suite_profile_registry.js'
      - 'wrangler.api.jsonc'
      - 'migrations/**'
      - 'scripts/test-v2-api-worker.js'
      - 'scripts/check-v2-api-contract.js'
      - '.github/workflows/realsignal-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realsignal-api-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate V2 boundary
        run: |
          node scripts/check-v2-api-contract.js
          node scripts/test-v2-api-worker.js
          node scripts/test-source-catalog-bridge.js
          node --check realsignal_api_v2_worker.js
          node --check realsignal_api_rotation.js
          node --check realsignal_source_catalog.js
          node --check source_suite_profile_registry.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check deployment credentials
        id: credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: repository secrets are not configured."
          fi
      - name: Deploy V2 API Worker
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.api.jsonc
