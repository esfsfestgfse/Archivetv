name: Deploy RealSignal V3 API

on:
  push:
    branches: [main]
    paths:
      - 'realsignal_api_v2_worker.js'
      - 'realsignal_roku_session.js'
      - 'realsignal_api_rotation.js'
      - 'realsignal_api_rate_limit.js'
      - 'realsignal_source_catalog.js'
      - 'vimeo_catalog.js'
      - 'ok_public_search.js'
      - 'ok_animation_catalog.js'
      - 'ok_curated_tv_catalog.js'
      - 'assets/ok-embed-runtime.js'
      - 'ok_animation_verified_seed.js'
      - 'ok_verified_search_seed.js'
      - 'ia_canonical_station.mjs'
      - 'ia_canonical_pilot_manifest.js'
      - 'source_suite_profile_registry.js'
      - 'wrangler.api.jsonc'
      - 'migrations/**'
      - 'scripts/test-v2-api-worker.js'
      - 'scripts/test-v3-api-contract.js'
      - 'scripts/test-ok-source-recovery.js'
      - 'scripts/test-ok-curated-tv.js'
      - 'scripts/test-ia-canonical-pilot.js'
      - 'scripts/check-v2-api-contract.js'
      - 'scripts/test-version5-gate.js'
      - '.github/workflows/realsignal-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realsignal-api-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate V3 API boundary
        run: |
          node scripts/check-v2-api-contract.js
          node scripts/test-external-source-channels.js
          node scripts/test-ok-source-recovery.js
          node scripts/test-ok-catalog-depth.js
          node scripts/test-ok-animation.js
          node scripts/test-ok-animation-depth.js
          node scripts/test-ok-curated-tv.js
          node scripts/test-vimeo-catalog-depth.js
          node scripts/test-vimeo-embed-runtime.js
          node scripts/test-v2-api-worker.js
          node scripts/test-v3-api-contract.js
          node scripts/test-ia-canonical-pilot.js
          node scripts/test-source-catalog-bridge.js
          node --check realsignal_api_v2_worker.js
          node --check realsignal_api_rotation.js
          node --check realsignal_api_rate_limit.js
          node --check realsignal_source_catalog.js
          node --check vimeo_catalog.js
          node --check ok_animation_catalog.js
          node --check ok_curated_tv_catalog.js
          node --check scripts/refresh-ok-catalogs.js
          node --check source_suite_profile_registry.js
          node --check ia_canonical_station.mjs

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check deployment credentials
        id: credentials
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment skipped: repository secrets are not configured."
          fi
      - name: Deploy V3 API Worker
        if: steps.credentials.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.api.jsonc --keep-vars
