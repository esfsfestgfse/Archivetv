name: Deepen Vimeo catalogs
on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vimeo-catalog-ingestion
  cancel-in-progress: false
jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Advance public verified TV and film catalogs serially
        run: node scripts/refresh-vimeo-catalogs.js
