<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealSignal · Broadcast Pilot</title>
<style>
  :root { color-scheme:dark; font:16px/1.5 system-ui,sans-serif; background:#0d1522; color:#edf2f8; }
  body { margin:0 auto; max-width:1280px; padding:clamp(14px,3vw,32px); }
  h1,h2,p { margin:0; } h1 { font-size:1.4rem; } h2 { font-size:1.1rem; }
  small { color:#a6b6c9; } header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  header small { color:#b4e7cf; letter-spacing:.08em; } main { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px; }
  section { min-width:0; border:1px solid #3d5068; border-radius:12px; padding:14px; background:#101a2b; }
  #screen { position:relative; aspect-ratio:16/9; display:grid; place-items:center; background:#060b13; overflow:hidden; border-radius:7px; }
  #screen video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  #broadcastEmbed { position:absolute; inset:0; }
  #broadcastEmbed iframe { width:100%; height:100%; border:0; }
  #screen:has(#broadcastEmbed:not([hidden])) { min-height:200px; }
  #status { padding:12px; text-align:center; color:#ffd681; }
  #controls { display:flex; gap:6px; flex-wrap:wrap; padding-top:10px; }
  button { min-height:44px; padding:8px 12px; border-radius:6px; background:#192436; border:1px solid #465771; color:inherit; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; } button:focus-visible { outline:2px solid #ffd681; }
  #stations { display:grid; gap:8px; margin-top:10px; max-height:65vh; overflow:auto; padding:2px 4px 2px 2px; }
  #guideFilters { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  #guideFilters input, #guideFilters select { min-height:42px; background:#192436; border:1px solid #465771;
    border-radius:6px; color:inherit; font:inherit; padding:0 9px; min-width:0; }
  #guideFilters input { flex:1 1 140px; }
  .station[hidden], #guideFilters[hidden] { display:none; }
  .station { width:100%; text-align:left; display:grid; gap:2px; }
  .station[aria-pressed="true"] { background:#332b20; border-color:#ae8b50; }
  .station strong { color:#ffd681; } .station span { overflow-wrap:anywhere; }
  #watching { margin-top:10px; }
  #nativeLink { color:#ffd681; display:inline-block; margin-top:8px; }
  #nativeLink[hidden] { display:none; }
  @media(max-width:740px) { main { grid-template-columns:1fr; } #stations { max-height:58vh; } }
</style>
</head>
<body>
<header><small>REALSIGNAL</small><h1>Shared Broadcast Pilot</h1></header>
<main>
  <section aria-label="Television">
    <div id="screen"><p id="status" role="status">Choose a station to tune in.</p><video id="video" playsinline muted hidden></video><div id="broadcastEmbed" hidden></div></div>
    <p id="watching"></p>
    <a id="nativeLink" hidden>Open this channel in RealSignal</a>
    <div id="controls">
      <button id="sound" type="button">Unmute</button>
      <button id="next" type="button" disabled>Next</button>
      <button id="live" type="button" disabled>Back to Live</button>
    </div>
  </section>
  <section aria-labelledby="guide">
    <h2 id="guide">Program guide</h2>
    <div id="guideFilters" hidden>
      <input type="search" id="channelSearch" aria-label="Search channels" placeholder="Channel name or number">
      <select id="channelCategory" aria-label="Channel category"><option value="">All channels</option></select>
    </div>
    <div id="stations"></div>
  </section>
</main>
<script type="module">
import { retainPublishedSlots, slotAt } from './assets/broadcast-clock.mjs';
import { createBroadcastPlayer } from './assets/broadcast-player.mjs';

const video = document.querySelector('#video');
const status = document.querySelector('#status');
const watching = document.querySelector('#watching');
const guide = document.querySelector('#stations');
const nextButton = document.querySelector('#next');
const liveButton = document.querySelector('#live');
const nativeLink = document.querySelector('#nativeLink');
const embedHost = document.querySelector('#broadcastEmbed');
const time = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
const stations = new Map();
const search = document.querySelector('#channelSearch');
const category = document.querySelector('#channelCategory');
let tuned, ahead, refreshTimer, refreshing = false, closed = false;
let hlsLibrary;
function loadHls() {
  if (window.Hls) return Promise.resolve(window.Hls);
  if (!hlsLibrary) {
    hlsLibrary = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js';
      script.onload = () => resolve(window.Hls);
      script.onerror = () => { script.remove(); reject(new Error('HLS unavailable')); };
      document.head.append(script);
    }).catch(error => { hlsLibrary = null; throw error; });
  }
  return hlsLibrary;
}
async function attachHls(video, url, options) {
  await import('./assets/peertube-media.js');
  if (!options.signal.aborted) window.RealSignalPeerTubeMedia.attach(video, url, { ...options, loadHls });
}
const embed = {
  async play({ slot, current, startSeconds, onPlaying, onEnded, onFailure }) {
    await import('./assets/youtube-embed-runtime.js');
    if (!current()) return;
    embedHost.hidden = false;
    const result = await window.RealSignalYouTubeEmbed.play({
      item: { embedUrl: slot.url, title: slot.title }, container: embedHost,
      isCurrent: current, startSeconds, muted: video.muted, volume: 1, onStarted: onPlaying,
      onEnded, onError: onFailure, onPending: onFailure
    });
    if (current() && result.status === 'unavailable') onFailure();
  },
  stop() {
    window.RealSignalYouTubeEmbed?.stop();
    embedHost.hidden = true;
  }
};
const player = createBroadcastPlayer({
  video, embed, attachHls,
  onCard: showCard,
  onPlaying(slot) {
    nativeLink.hidden = true;
    video.hidden = ['audio', 'youtube'].includes(slot.mediaType);
    status.hidden = slot.mediaType !== 'audio';
    if (!status.hidden) write(status, 'Audio broadcast');
  },
  onEnded(slot, live) {
    if (!live && ahead === slot) { ahead = nextProgram(tuned, ahead); render(); }
    else if (Date.now() < slot.endsAt) showCard('Next program at ' + time.format(slot.endsAt));
    else render();
  }
});

function write(element, value) {
  if (element.textContent !== value) element.textContent = value;
}

function showCard(message) {
  video.pause();
  video.hidden = true;
  embed.stop();
  status.hidden = false;
  nativeLink.hidden = !(tuned?.source && /unavailable|window ended/i.test(message));
  if (!nativeLink.hidden) nativeLink.href = nativeChannelUrl(tuned);
  write(status, message);
}

function nextProgram(station, current) {
  return current && station.slots.find(slot => slot.kind === 'program' && slot.startsAt > current.startsAt);
}

function render(force = false) {
  const now = Date.now();
  for (const station of stations.values()) {
    if (station.button.hidden && tuned !== station) continue;
    const current = slotAt(station, now)?.slot;
    const next = nextProgram(station, current);
    const liveFeed = ['livetv', 'liveradio', 'weather', 'sports'].includes(station.source);
    write(station.onAir, current ? (current.kind === 'break' ? 'Commercial break' : current.title)
      : station.source ? (liveFeed ? 'Live feed · Open in RealSignal' : 'Open in RealSignal') : 'Schedule unavailable');
    write(station.upcoming, next ? 'Next at ' + time.format(next.startsAt) + ' · ' + next.title : '');
  }
  if (!tuned) return;
  const current = slotAt(tuned, now)?.slot;
  const selected = ahead || current;
  player.load(selected, !ahead, force);
  nextButton.disabled = !nextProgram(tuned, selected);
  liveButton.disabled = !ahead;
  write(watching, (ahead ? 'Watching ahead' : 'Live') + ' · ' + tuned.name +
    (selected?.kind === 'program' ? ' · ' + selected.title : ''));
}

function nativeChannelUrl(station) {
  const layout = matchMedia('(max-width:740px)').matches ? 'mobile' : 'desktop';
  return './the_dial_' + layout + '.html?channel=' + encodeURIComponent(station.channel);
}

function tune(station) {
  if (station.source && !slotAt(station, Date.now())) {
    location.href = nativeChannelUrl(station);
    return;
  }
  tuned = station;
  ahead = null;
  stations.forEach(row => row.button.setAttribute('aria-pressed', String(row === station)));
  render(true);
}

nextButton.addEventListener('click', () => {
  const next = nextProgram(tuned, ahead || slotAt(tuned, Date.now())?.slot);
  if (next) { ahead = next; render(); }
});
liveButton.addEventListener('click', () => { ahead = null; render(true); });
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && tuned && !ahead) render(true);
});
window.addEventListener('pagehide', () => {
  closed = true;
  clearTimeout(refreshTimer);
  player.dispose();
});
window.addEventListener('pageshow', event => {
  if (!event.persisted) return;
  closed = false;
  render(true);
  void refreshSchedule();
});
document.querySelector('#sound').addEventListener('click', event => {
  video.muted = !video.muted;
  window.RealSignalYouTubeEmbed?.volume(1, video.muted);
  write(event.currentTarget, video.muted ? 'Unmute' : 'Mute');
});

function updateStation(row) {
  let station = stations.get(row.channel);
  if (station) {
    if (row.generatedAt < station.generatedAt) return;
    station.slots = retainPublishedSlots(station.slots, row.slots);
    station.generatedAt = row.generatedAt;
  } else {
    station = { ...row, button: document.createElement('button'), info: document.createElement('small'),
      onAir: document.createElement('span'), upcoming: document.createElement('small') };
    const { button, info, onAir, upcoming } = station;
    button.className = 'station';
    button.type = 'button';
    button.setAttribute('aria-pressed', 'false');
    const title = document.createElement('strong');
    title.textContent = station.channel + ' · ' + station.name;
    button.append(title, info, onAir, upcoming);
    button.addEventListener('click', () => tune(station));
    guide.append(button);
    stations.set(station.channel, station);
  }
  if (row.depth) {
    write(station.info, station.category + ' · ' + row.depth.episodes + ' episodes · ' + Math.floor(row.depth.hours) + ' hours');
  } else if (!station.slots.length) {
    write(station.info, row.category);
  }
}

function filterGuide() {
  const query = search.value.trim().toLowerCase();
  for (const station of stations.values()) {
    station.button.hidden = (category.value && station.category !== category.value) ||
      (query && !(station.channel + ' ' + station.name).toLowerCase().includes(query));
  }
  render();
}
search.addEventListener('input', filterGuide);
category.addEventListener('change', filterGuide);

async function refreshSchedule() {
  if (closed || refreshing) return;
  refreshing = true;
  try {
    const response = await fetch('./output/broadcast-pilot-preview/preview.json', {
      cache: 'no-cache', signal: AbortSignal.timeout(8000)
    });
    if (!response.ok) throw new Error('Missing pilot schedule');
    const data = await response.json();
    if (!Array.isArray(data.stations) || !data.stations.length) throw new Error('Empty pilot schedule');
    if (closed) return;
    const firstLoad = !stations.size;
    for (const row of data.lineup || []) {
      if (stations.has(row.channel)) continue;
      updateStation({ ...row, slots: [], generatedAt: 0 });
      if (!Array.from(category.options).some(option => option.value === row.category)) {
        category.add(new Option(row.category, row.category));
      }
    }
    document.querySelector('#guideFilters').hidden = !data.lineup?.length;
    for (const row of data.stations) updateStation(row);
    if (firstLoad) showCard('Choose a station to tune in.');
    filterGuide();
  } catch (error) {
    if (!closed && !stations.size) showCard('Waiting for the program guide…');
    console.error(error);
  } finally {
    refreshing = false;
    if (!closed) refreshTimer = setTimeout(refreshSchedule, stations.size ? 60_000 : 10_000);
  }
}

void refreshSchedule();
setInterval(() => { if (!closed) render(); }, 500);
</script>
</body>
</html>
